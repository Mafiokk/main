<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário, eu acho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-image: 
                linear-gradient(rgba(13, 13, 13, 0.85), rgba(13, 13, 13, 0.85)), 
                url("https://i.imgur.com/m79XkX7.png");
            
            background-repeat: repeat-y; 
            background-position: top center; 
            background-size: auto; 
            
            color: #ffffff;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        
        #lock-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .lock-box {
            background: rgba(8, 8, 8, 0.85);
            border: 1px solid #1a1a1a;
            border-left: 4px solid #9b111e;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .lock-box h2 {
            color: #f8f8ff;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .lock-box input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
            font-size: 1rem;
            outline: none;
            margin-bottom: 15px;
        }

        .lock-box input[type="password"]:focus {
            border-color: #6c5ce7;
        }

        .lock-box button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #0d0d0d;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .lock-box button:hover {
            background: #5b4bc4;
        }

        #error-msg {
            color: #ff5555;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: rgba(8, 8, 8, 0.3); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            
            border: 1px solid #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 0 auto;

            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

     
        .container.fade-in {
            opacity: 1;
        }

        .main-title {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #18738f; 
            border-radius: 15px 0 0 15px;
            padding: 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #18738f;
        }

        .intro-block {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #6c5ce7; 
            border-radius: 15px 0 0 15px;
            padding: 15px;
            text-align: center;
            font-size: 1.05rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .text-item {
            background: rgba(8, 8, 8, 0.65); 
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            
            border-left: 3px solid #6c5ce7;
            border-radius: 15px 0 0 15px;
            padding: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
            transition: background 0.3s;
        }

        .text-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .text-item h3 {
            color: #ff79c6;
            margin-bottom: 8px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            overflow: hidden;
        }

        .image-box figure {
            width: 100%;
            margin: 0;
            text-align: center;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            transition: transform 0.3s;
        }

        .image-box img:hover {
            transform: scale(1.02); 
        }

        .timeline-section {
            width: 100%;
            margin-top: 10px;
        }

        .timeline-intro {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff79c6;
            margin-bottom: 25px;
        }

        .timeline-intro p {
            font-size: 0.95rem;
            color: #b3b3b3;
            font-weight: normal;
            margin-top: 8px;
        }

        .timeline-container {
            position: relative;
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .timeline-line {
            position: absolute;
            top: 15px;
            bottom: 15px;
            left: 15px;
            width: 2px;
            background: rgba(108, 92, 231, 0.3);
        }

        .timeline-item {
            position: relative;
            width: 100%;
        }

        .timeline-badge {
            position: absolute;
            left: -32px;
            top: 22px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            z-index: 2;
        }

        .purple-dot {
            background-color: #6c5ce7;
            box-shadow: 0 0 8px #6c5ce7;
        }
        .purple-text {
            color: #6c5ce7 !important;
        }

        .gold-dot {
            background-color: #f1c40f;
            box-shadow: 0 0 8px #f1c40f;
        }
        .gold-text {
            color: #f1c40f !important;
        }

        .pink-dot {
            background-color: #ff79c6;
            box-shadow: 0 0 8px #ff79c6;
        }
        .pink-text {
            color: #ff79c6 !important;
        }

        .timeline-card {
            background: rgba(8, 8, 8, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 20px;
            transition: background 0.3s, transform 0.2s;
        }

        .timeline-card:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(3px);
        }

        .timeline-date {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .timeline-text {
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.6;
        }

        .timeline-footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 1rem;
            color: #b3b3b3;
            font-style: italic;
        }

        .audio-container {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #ff79c6;
            border-radius: 15px 0 0 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .audio-title {
            font-size: 0.95rem;
            color: #e0e0e0;
            font-weight: 500;
        }

        audio {
            width: 100%;
            max-width: 400px;
            height: 40px;
            border-radius: 20px;
            filter: invert(90%) hue-rotate(180deg);
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        audio:hover {
            opacity: 1;
        }

        .main-footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            color: #777777;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .main-footer .footer-sub {
            color: #ff79c6;
            font-size: 0.75rem;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            .container { padding: 15px; gap: 15px; }
            .main-title { font-size: 1.25rem; padding: 15px 10px; }
            .timeline-container { padding-left: 30px; }
            .timeline-line { left: 10px; }
            .timeline-badge { left: -27px; width: 12px; height: 12px; top: 18px; }
            .timeline-card { padding: 15px; }
            .timeline-text { font-size: 0.85rem; }
        }
    </style>
</head>

            <button onclick="unlock()">Entrar</button>
            <p id="error-msg">Sem permissão de acesso.</p>
        </div>
    </div>
    <div class="container" id="main-content" style="display: none;">

    function unlock() {
        const input = document.getElementById("password-input").value;
        const lockScreen = document.getElementById("lock-screen");
        const mainContent = document.getElementById("main-content");
        const errorMsg = document.getElementById("error-msg");
        
        try {
            const bytes = CryptoJS.AES.decrypt(DIARIO_CRIPTOGRAFADO, input);
            const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);
            if (!decryptedHTML || decryptedHTML.length === 0) {
                throw new Error("Senha incorreta");
            }
            mainContent.innerHTML = decryptedHTML;
            lockScreen.classList.add("fade-out");
            mainContent.style.display = "flex";
            setTimeout(() => {
                mainContent.classList.add("fade-in");
            }, 50);
            setTimeout(() => {
                lockScreen.style.display = "none";
            }, 600);
            const audio = document.getElementById('musica');
            if (audio) {
                audio.volume = 0.1;
                audio.play().catch(() => {});
            }
        } catch (error) {
            errorMsg.style.display = "block";
            document.getElementById("password-input").value = "";
        }
    }
    function checkEnter(event) {
        if (event.key === "Enter") {
            unlock();
        }
    }
</script>
