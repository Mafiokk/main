<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>

        body {
            background-color: #121212;
            background-image: linear-gradient(135deg, #000f0f 0%, #000000 100%);
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        #lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            padding: 40px;
            border: 1px solid #331818;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 999;
        }
        #lock-screen h2 { color: #ff0022; margin-top: 0; }
        #password-input {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #360101;
            background: #000000;
            color: #fff;
            outline: none;
            text-align: center;
        }
        #error-msg { color: #ff5555; display: none; font-size: 0.9rem; margin-top: 10px; }

    
        #audio-wrapper {
            display: none;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .audio-container {
            padding: 15px;
            background: rgba(20, 15, 26, 0.8);
            border: 1px solid #3d2c5e;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .audio-title { font-size: 0.9rem; color: #ff79c6; margin-bottom: 12px; font-style: italic; }
        audio { width: 100%; height: 35px; outline: none; filter: invert(90%) hue-rotate(180deg) saturate(80%) contrast(120%); }

        #book-wrapper {
            position: relative;
            width: 90vw;
            max-width: 450px;
            height: 600px;
            perspective: 1500px;
            display: none; 
        }
        .page {
            position: absolute;
            top: 0;   
            left: 0;  
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            border: 1px solid #2a203b;
            box-shadow: inset -5px 0 20px rgba(0, 0, 0, 0.8), 5px 5px 15px rgba(0,0,0,0.5);
            border-radius: 4px 15px 15px 4px;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2.5rem 2rem;
            box-sizing: border-box;
            backface-visibility: hidden;
            overflow-y: auto;
        }
        .page::-webkit-scrollbar { width: 5px; }
        .page::-webkit-scrollbar-thumb { background: #3d2c5e; border-radius: 5px; }

        .page.flipped {
            transform: rotateY(-180deg);
            opacity: 0;
            pointer-events: none;
        }
        
        .purple-text { color: #bd93f9 !important; }
        .gold-text { color: #f1fa8c !important; }
        .pink-text { color: #ff79c6 !important; }

        .main-title { font-size: 2.2rem; color: #f1fa8c; text-align: center; margin-bottom: 25px; }
        .date-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; text-align: center; color: #bd93f9; }
        .day-text { font-size: 1.05rem; line-height: 1.7; color: #d4c5eb; text-align: center; }
        figure { margin: 0; text-align: center; }
        figure img { max-width: 100%; max-height: 250px; border-radius: 6px; border: 2px solid #3d2c5e; object-fit: cover; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6); }
        figcaption { margin-top: 15px; font-size: 0.85rem; color: #8c7b9e; font-style: italic; }


        .controls { margin-top: 30px; gap: 20px; z-index: 10; display: none; }
        button { background: #000000; color: #ffffff; border: 1px solid #f8f8ff; padding: 10px 25px; border-radius: 20px; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; }
        button:hover:not(:disabled) { background: #f8f8ff; color: #0d0a11; }
        button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; }
        .page-number { position: absolute; bottom: 15px; right: 20px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>
    

    <div id="lock-screen">
        <h2>🔐 Quem é você?</h2>
        <input type="password" id="password-input" placeholder="Digite a senha...">
        <button id="unlock-btn">Entrar</button>
        <p id="error-msg">Sem permissão ou dados corrompidos.</p>
    </div>

    <div id="audio-wrapper">
        <div class="audio-container">
            <div class="audio-title">🎵 Lembrei que vc gosta, pra acompanhar sua leitura🎵</div>

        </div>
    </div>


    <div id="book-wrapper">
   
    </div>


    <div class="controls" id="book-controls">
        <button id="prevBtn" disabled>← Anterior</button>
        <button id="nextBtn">Próximo →</button>
    </div>

        document.getElementById('unlock-btn').addEventListener('click', function() {
            const password = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if(!password) return;

            try {
                const bytes = CryptoJS.AES.decrypt(CONTEUDO_CRIPTOGRAFADO, password);
                const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);

                if (!decryptedHTML || decryptedHTML.trim() === "") {
                    throw new Error("Senha incorreta");
                }

              
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('audio-wrapper').style.display = 'block';
                document.getElementById('book-wrapper').style.display = 'block';
                document.getElementById('book-controls').style.display = 'flex';

        
                const bookContainer = document.getElementById('book-wrapper');
                bookContainer.innerHTML = CAPA_FRONTAL + decryptedHTML + CAPA_TRASEIRA;

        
                const player = document.getElementById('musica');
                if (player) player.volume = 0.1;

                iniciarDiario();

            } catch (e) {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        });

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('unlock-btn').click();
            }
        });

        function iniciarDiario() {
            const pages = document.querySelectorAll('.page');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            let currentPage = 0;

            pages.forEach((page, index) => {
                page.style.zIndex = pages.length - index;
                
                if (!page.classList.contains('cover') && !page.classList.contains('back-cover')) {
                    const pageNum = document.createElement('div');
                    pageNum.className = 'page-number';
                    pageNum.textContent = index;
                    page.appendChild(pageNum);
                }
            });

            function updateButtons() {
                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage === pages.length - 1;
            }

            nextBtn.addEventListener('click', () => {
                if (currentPage < pages.length - 1) {
                    pages[currentPage].classList.add('flipped');
                    currentPage++;
                    updateButtons();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    pages[currentPage].classList.remove('flipped');
                    updateButtons();
                }
            });

            updateButtons();
        }
    </script>
